<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f5f1;color:#26221e;font-family:"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif;}
a{color:#315bea;text-underline-offset:3px;}
a:hover{color:#2b52d4;}
</style>
</helmet>
<section style="padding:56px 64px 80px;">
<div style="width:18px;height:2px;background:#315bea;"></div>
<div style="font-size:32px;font-weight:500;letter-spacing:-0.02em;margin-top:12px;">Saminest iOS · 第 1 轮</div>
<div style="font-size:15px;color:#756e65;margin-top:8px;max-width:760px;line-height:1.6;">每台手机都能点：切换 Tab、看详情、收藏、报名、发消息、从右上角「＋」发布，在「我的 → 设置」里退出登录可以看到登录和注册页。</div>
<div style="display:flex;flex-wrap:wrap;gap:56px;margin-top:40px;">
<div id="1a" style="display:flex;flex-direction:column;gap:14px;">
<div style="display:flex;align-items:center;gap:10px;"><span style="height:24px;padding:0 9px;border-radius:4px;border:1px solid #315bea;color:#2b52d4;font-size:13px;display:flex;align-items:center;font-family:ui-monospace,Menlo,monospace;">1a</span><span style="font-size:17px;font-weight:500;">瀑布流 + 头像格</span></div>
<div style="font-size:13px;color:#756e65;max-width:410px;line-height:1.5;">保留现有结构：首页双列瀑布流；找搭子卡片下方是贴边铺满的方形头像格，空位就是「还差几个人」。</div>
<dc-import name="Saminest Phone" variant="A" start-screen="{{ startScreen }}" hint-size="410px,864px"></dc-import>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;acts&quot;,&quot;msgs&quot;,&quot;me&quot;,&quot;login&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { startScreen: this.props.startScreen || 'home' }; }
}
</script>
</body>
</html>
