<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: 'Noto Sans CJK SC', sans-serif;
    background: radial-gradient(circle at 85% 15%, #4A72F0 0%, #315BEA 42%, #1E3FAE 100%);
    position: relative;
  }
  .blob {
    position: absolute;
    width: 820px; height: 820px;
    right: -220px; top: -260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .blob2 {
    position: absolute;
    width: 520px; height: 520px;
    left: -160px; bottom: -220px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }

  .brand {
    position: absolute;
    top: 44px; right: 52px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
  }
  .brand .mark svg { width: 24px; height: 24px; }
  .brand .word { font-size: 28px; font-weight: 900; color: rgba(255,255,255,0.92); }

  .tag {
    position: absolute;
    top: 64px; left: 64px;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 26px; font-weight: 700; color: #FFFFFF;
  }

  .title {
    position: absolute;
    left: 64px; top: 190px; right: 120px;
    font-size: 64px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.32;
  }

  .meta {
    position: absolute;
    left: 64px; bottom: 76px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .meta-row {
    display: flex; align-items: center; gap: 18px;
  }
  .meta-row .icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
  }
  .meta-row .icon svg { width: 26px; height: 26px; }
  .meta-row .text {
    font-size: 34px; font-weight: 600; color: #FFFFFF;
  }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="blob2"></div>

  <div class="tag">
    <span>🚗</span><span>拼车 / 一起采购</span>
  </div>

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="10" r="7" fill="none" stroke="white" stroke-width="2.4"/>
        <circle cx="12" cy="15.2" r="2.6" fill="white"/>
      </svg>
    </div>
    <div class="word">Saminest</div>
  </div>

  <div class="title">求10月1日去纽约的<br/>拼车搭子</div>

  <div class="meta">
    <div class="meta-row">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>
          <path d="M12 7V12L15.5 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="text">10月1日 周四 12:00</div>
    </div>
    <div class="meta-row">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="12" cy="9.5" r="2.4" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <div class="text">Arlington · 还差 1 人（3/4）</div>
    </div>
  </div>
</body>
</html>
