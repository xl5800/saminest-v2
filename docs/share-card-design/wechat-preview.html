<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:900px; height:500px; overflow:hidden; }
  body {
    font-family: 'Noto Sans CJK SC', sans-serif;
    background: #EDEDED;
    padding: 60px 50px;
  }
  .bubble-wrap {
    display: flex;
    justify-content: flex-end;
  }
  .card {
    width: 560px;
    background: #FFFFFF;
    border-radius: 6px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .card-title {
    font-size: 30px;
    font-weight: 700;
    color: #1A1A1A;
    line-height: 1.38;
  }
  .card-sub {
    margin-top: 10px;
    font-size: 22px;
    color: #8A8A8A;
  }
  .thumb {
    flex-shrink: 0;
    width: 96px; height: 96px;
    border-radius: 8px;
    background: linear-gradient(135deg, #4A72F0 0%, #1E3FAE 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .thumb svg { width: 46px; height: 46px; }
  .divider {
    margin-top: 18px;
    border-top: 1px solid #EEEEEE;
    padding-top: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .divider .dot {
    width: 18px; height: 18px; border-radius: 5px;
    background: #315BEA;
  }
  .divider .name {
    font-size: 20px; color: #999999;
  }
  .label {
    text-align: right;
    margin-top: 14px;
    font-size: 20px;
    color: #B0B0B0;
  }
</style>
</head>
<body>
  <div class="label">微信聊天里实际显示效果 →</div>
  <div class="bubble-wrap">
    <div class="card">
      <div class="card-top">
        <div>
          <div class="card-title">求10月1日去纽约的拼车搭子</div>
          <div class="card-sub">10月1日 12:00 · Arlington</div>
        </div>
        <div class="thumb">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="10" r="7" fill="none" stroke="white" stroke-width="2.2"/>
            <circle cx="12" cy="15.2" r="2.4" fill="white"/>
          </svg>
        </div>
      </div>
      <div class="divider">
        <div class="dot"></div>
        <div class="name">Saminest</div>
      </div>
    </div>
  </div>
</body>
</html>
